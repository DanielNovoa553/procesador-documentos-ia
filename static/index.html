<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procesador de documentos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container contenedor d-flex align-items-center justify-content-between py-3">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-icon"><i class="bi bi-file-earmark-text"></i></div>
        <div>
          <div class="fw-semibold lh-1">Procesador de documentos</div>
          <div class="text-secondary small">Extracción y validación de facturas con IA</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="modo" class="modo-badge">…</span>
        <button id="btn-tema" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Cambiar tema">
          <i id="tema-icono" class="bi bi-moon-stars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container contenedor py-4">
    <section class="row g-3 mb-4" aria-label="Resumen">
      <div class="col-6 col-lg-3">
        <div class="card kpi">
          <div class="kpi-icono kpi-azul"><i class="bi bi-files"></i></div>
          <div><div id="kpi-total" class="kpi-valor">0</div><div class="kpi-etiqueta">Documentos</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi">
          <div class="kpi-icono kpi-verde"><i class="bi bi-check2-circle"></i></div>
          <div><div id="kpi-validados" class="kpi-valor">0</div><div class="kpi-etiqueta">Validados</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi">
          <div class="kpi-icono kpi-ambar"><i class="bi bi-exclamation-triangle"></i></div>
          <div><div id="kpi-revision" class="kpi-valor">0</div><div class="kpi-etiqueta">En revisión</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi">
          <div class="kpi-icono kpi-gris"><i class="bi bi-percent"></i></div>
          <div><div id="kpi-tasa" class="kpi-valor">—</div><div class="kpi-etiqueta">Tasa de validación</div></div>
        </div>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <div class="d-flex flex-column flex-md-row align-items-md-center gap-3">
          <div id="dropzone" class="dropzone flex-grow-1" role="button" tabindex="0"
               aria-label="Seleccionar o arrastrar un archivo PDF">
            <i class="bi bi-cloud-arrow-up dz-icono"></i>
            <div>
              <div id="dz-texto" class="fw-semibold">Arrastra una factura en PDF o haz clic para seleccionarla</div>
              <div id="dz-nombre" class="text-secondary small">Máximo 5 MB</div>
            </div>
            <input id="archivo" type="file" accept="application/pdf,.pdf" hidden>
          </div>
          <button id="enviar" class="btn btn-primary btn-lg px-4" type="button" disabled>
            <span id="enviar-spinner" class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
            <span id="enviar-texto">Procesar</span>
          </button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header d-flex flex-column flex-md-row gap-2 justify-content-between align-items-md-center">
        <div class="fw-semibold">Documentos procesados</div>
        <div class="d-flex gap-2">
          <div class="input-group input-group-sm buscador">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="buscar" type="search" class="form-control" placeholder="Buscar archivo o emisor">
          </div>
          <select id="filtro" class="form-select form-select-sm filtro">
            <option value="">Todos</option>
            <option value="validado">Validados</option>
            <option value="revision_manual">En revisión</option>
          </select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table tabla align-middle mb-0">
          <thead>
            <tr>
              <th>Archivo</th>
              <th>Emisor</th>
              <th>Fecha</th>
              <th class="text-end">Total</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
      <div class="card-footer text-secondary small" id="contador"></div>
    </section>
  </main>

  <div id="detalle" class="offcanvas offcanvas-end" tabindex="-1" aria-labelledby="detalle-titulo">
    <div class="offcanvas-header border-bottom">
      <div>
        <h2 id="detalle-titulo" class="offcanvas-title h5 mb-0"></h2>
        <div id="detalle-fecha" class="text-secondary small"></div>
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div id="detalle-cuerpo" class="offcanvas-body"></div>
  </div>

  <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
